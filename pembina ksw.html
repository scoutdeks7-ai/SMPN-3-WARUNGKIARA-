<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembina - Rekap Absensi Pramuka KSW</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #102a1c;
            --primary-light: #1b4332;
            --accent: #2d6a4f;
            --gold: #d4af37;
            --bg-dark: #0b1c12;
            --card-bg: #132e1f;
            --text-main: #f0fdf4;
            --text-muted: #86efac;
            --border: #22543d;
            --danger: #ef4444;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1b4332 0%, #0b1c12 75%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Admin */
        .admin-header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container {
            width: 55px;
            height: 55px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold);
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .brand-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-download {
            background: var(--accent);
            color: #fff;
        }
        .btn-download:hover { background: #38a169; }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.5rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Filter & Table Section */
        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 16px;
            background: rgba(11, 28, 18, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
        }
        .search-input:focus { border-color: var(--gold); }

        /* Table Styling */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(27, 67, 50, 0.6);
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:hover td {
            background: rgba(27, 67, 50, 0.2);
        }

        .badge-materi {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .thumb-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid var(--gold);
            transition: transform 0.2s;
        }
        .thumb-img:hover { transform: scale(1.1); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 10px;
        }

        /* Modal Image Viewer */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            padding: 20px;
            border-radius: var(--radius);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .modal-content img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn-close {
            background: var(--gold);
            color: #0b1c12;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Admin -->
        <div class="admin-header">
            <div class="brand-wrapper">
                <div class="logo-container">
                    <img src="1000597492.png" alt="Logo KSW" onerror="this.src='https://via.placeholder.com/55?text=KSW'">
                </div>
                <div class="brand-title">
                    <h1>Portal Pembina KSW</h1>
                    <p>Rekapitulasi Kehadiran Ekstrakurikuler Pramuka SMPN 3 Warungkiara</p>
                </div>
            </div>
            <div class="admin-actions">
                <button class="btn-action btn-download" onclick="exportToCSV()">
                    <i class="fa-solid fa-file-excel"></i> Unduh Laporan (CSV)
                </button>
                <button class="btn-action btn-danger" onclick="clearData()">
                    <i class="fa-solid fa-trash-can"></i> Reset Data
                </button>
            </div>
        </div>

        <!-- Statistik -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info">
                    <h3 id="totalHadir">0</h3>
                    <p>Total Absen Masuk</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="stat-info">
                    <h3 id="totalHariEskul">0</h3>
                    <p>Total Pertemuan Eskul</p>
                </div>
            </div>
        </div>

        <!-- Tabel Rekap -->
        <div class="content-card">
            <div class="filter-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari nama siswa atau materi..." onkeyup="filterTable()">
            </div>

            <div class="table-responsive">
                <table id="tabelAbsensi">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Tanggal Eskul</th>
                            <th>Nama Anggota</th>
                            <th>Materi Dipaparkan</th>
                            <th>Waktu Kirim</th>
                            <th>Bukti Foto</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data akan dimasukkan lewat Javascript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Lihat Foto -->
    <div class="modal" id="photoModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 10px; color: var(--gold);" id="modalTitle">Bukti Kegiatan</h3>
            <img id="modalImg" src="" alt="Bukti Foto">
            <br>
            <button class="btn-close" onclick="closePhotoModal()">Tutup</button>
        </div>
    </div>

    <script>
        let absensiData = [];

        function loadData() {
            const stored = localStorage.getItem('absensiPramukaKSW');
            absensiData = stored ? JSON.parse(stored) : [];
            renderTable(absensiData);
            updateStats();
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">
                    <i class="fa-solid fa-folder-open"></i><br>Belum ada data absensi yang masuk.
                </td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.tanggal}</td>
                    <td><strong>${item.nama}</strong></td>
                    <td><span class="badge-materi">${item.materi}</span></td>
                    <td>${item.waktuKirim || '-'}</td>
                    <td><img src="${item.foto}" class="thumb-img" onclick="showPhoto('${item.foto}', '${item.nama} - ${item.materi}')" alt="Foto"></td>
                    <td>
                        <button onclick="deleteItem(${item.id})" class="btn-action btn-danger" style="padding: 6px 10px; font-size: 0.75rem;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            document.getElementById('totalHadir').innerText = absensiData.length;
            
            // Hitung total tanggal unik
            const uniqueDates = [...new Set(absensiData.map(item => item.tanggal))];
            document.getElementById('totalHariEskul').innerText = uniqueDates.length;
        }

        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = absensiData.filter(item => 
                item.nama.toLowerCase().includes(keyword) || 
                item.materi.toLowerCase().includes(keyword) ||
                item.tanggal.includes(keyword)
            );
            renderTable(filtered);
        }

        function showPhoto(src, title) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('photoModal').style.display = 'flex';
        }

        function closePhotoModal() {
            document.getElementById('photoModal').style.display = 'none';
        }

        function deleteItem(id) {
            if (confirm('Yakin ingin menghapus data absensi ini?')) {
                absensiData = absensiData.filter(item => item.id !== id);
                localStorage.setItem('absensiPramukaKSW', JSON.stringify(absensiData));
                renderTable(absensiData);
                updateStats();
            }
        }

        function clearData() {
            if (confirm('PERINGATAN: Seluruh data rekapitulasi absensi akan dihapus permanen! Lanjutkan?')) {
                localStorage.removeItem('absensiPramukaKSW');
                loadData();
            }
        }

        function exportToCSV() {
            if (absensiData.length === 0) {
                alert('Tidak ada data untuk diekspor!');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,No,Tanggal,Nama Anggota,Materi,Waktu Kirim\n";
            absensiData.forEach((item, index) => {
                csvContent += `${index + 1},"${item.tanggal}","${item.nama}","${item.materi}","${item.waktuKirim}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "rekap_absensi_pramuka_ksw.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Muat data saat halaman dibuka
        window.onload = loadData;
    </script>
</body>
</html>
